name: pilot
# Runs agents on AIOpsLab problems in a kind cluster on the GitHub runner.
# agent=probe needs no key and checks the instrumentation end to end.
# agent=model reads the repository secret LLM_API_KEY and stops at budget_usd.
on:
  workflow_dispatch:
    inputs:
      agent: {description: "probe or model", default: "probe"}
      model: {description: "model name for agent=model", default: ""}
      condition: {description: "A (free text) or B (evidence links)", default: "A"}
      problems: {description: "space-separated AIOpsLab problem ids", default: "pod_failure_hotel_res-localization-1"}
      seeds: {description: "space-separated seeds", default: "0"}
      budget_usd: {description: "stop once spend reaches this", default: "5"}
      price_in: {description: "USD per million input tokens", default: "0"}
      price_out: {description: "USD per million output tokens", default: "0"}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      AIOPSLAB_COMMIT: 576c3f080c7ae2459a972afd4a2f8d5f01828430
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: azure/setup-helm@v4
      - name: Install kind
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: AIOpsLab at the pinned commit
        run: |
          git clone --recurse-submodules https://github.com/microsoft/AIOpsLab.git aiopslab
          cd aiopslab && git checkout "$AIOPSLAB_COMMIT" && git submodule update --init --recursive
          pip install -e . && pip install -e ..
          cp aiopslab/config.yml.example aiopslab/config.yml
          sed -i "s/^k8s_host:.*/k8s_host: kind/; s/^k8s_user:.*/k8s_user: $(whoami)/" aiopslab/config.yml
          # The runner pulls about 20 images on first deploy; 300 s is too short there (pilot runs of Nov 5, 2026).
          sed -i "s/def wait_for_ready(self, namespace, sleep=2, max_wait=300)/def wait_for_ready(self, namespace, sleep=2, max_wait=900)/" aiopslab/service/kubectl.py
          grep -n "max_wait=900" aiopslab/service/kubectl.py
      - name: kind cluster
        run: |
          kind create cluster --config aiopslab/kind/kind-config-x86.yaml --wait 300s
          # The private-repo runner has 2 CPUs; one schedulable worker ran out of CPU requests (pilot of Nov 5, 2026:
          # mongodb-user and user stayed Pending, "Insufficient cpu"). Let pods use the control-plane node as well.
          kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
          kubectl get nodes -o wide
      - name: Runs
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          mkdir -p runs
          # Background watcher: every 60 s, the hotel-reservation pods, claims and recent events (diagnoses a stuck deploy).
          ( while true; do date -u; kubectl get pods -n test-hotel-reservation -o wide 2>&1; kubectl get pvc -A 2>&1;
              kubectl get events -n test-hotel-reservation --sort-by=.lastTimestamp 2>&1 | tail -15; echo; sleep 60; done ) > runs/deploy_watch.txt 2>&1 &
          cd aiopslab
          python ../scripts/run_aiopslab.py --agent "${{ inputs.agent }}" --model "${{ inputs.model }}" \
            --condition "${{ inputs.condition }}" --problems ${{ inputs.problems }} --seeds ${{ inputs.seeds }} \
            --budget-usd "${{ inputs.budget_usd }}" --price-in "${{ inputs.price_in }}" --price-out "${{ inputs.price_out }}" \
            --out ../runs
      - name: Cluster state at the end
        if: always()
        run: |
          { kubectl get nodes -o wide; kubectl get pods -A -o wide; kubectl get pvc -A; kubectl get sc;
            kubectl describe pods -n test-hotel-reservation | grep -E "^Name:|State:|Reason:|Message:|Image:|Warning|Failed" | head -200;
            df -h /; free -m; } > runs/cluster_end.txt 2>&1 || true
          tail -60 runs/cluster_end.txt
      - name: Instrumentation check on every run
        if: always()
        run: |
          shopt -s nullglob
          for s in runs/*/session.json; do echo "== $s"; evtrace selftest "$s" || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: runs, path: runs, if-no-files-found: warn}
